name: tests

# Hai OS, vì repo này phải chạy trên cả máy Windows lẫn máy Mac. CI CỐ Ý không cài Node,
# HyperFrames, ffmpeg hay model nào: bộ test phải xanh trên một máy trần — lệnh ngoài đều
# được thay bằng hàm giả. Cần engine thật mới chạy được test nghĩa là test đang đo môi
# trường chứ không đo mã.
#
# `push` KHÔNG lọc nhánh: nhánh làm việc cũng phải được đo trước khi mở pull request —
# lọc `[main]` nghĩa là lỗi của nhánh chỉ lộ ra khi đã đứng trước cửa merge.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        # Đủ dải `requires-python = ">=3.10"`: đầu dưới (3.10 — chưa có `tomllib`), bản máy
        # dựng đang chạy (3.12) và bản mới nhất có sẵn trên runner (3.13).
        python-version: ['3.10', '3.12', '3.13']
    steps:
      # Action ghim theo SHA commit, không theo tag: tag là con trỏ di động, chủ repo action
      # dời nó đi đâu thì CI chạy mã ở đó. Chú thích cuối dòng là tag tương ứng để người đọc.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cài package (lõi + extras test)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Chạy bộ test
        # Cây làm việc là một bản checkout git thật, nên các cổng `git check-ignore`
        # (bị skip khi chạy trên cây chưa git init) chạy thật ở đây.
        run: python -m pytest -q

  upstream:
    # Job RIÊNG vì nó là job DUY NHẤT cần mạng: nó tải `skills-manifest.json` của upstream
    # tại đúng tag đã ghim rồi so 21 hash đã chép vào `upstream.json`. Không có job này thì
    # cổng hash là tự quy chiếu — hai file do cùng một người viết so với nhau, bịa cả hai chỗ
    # vẫn xanh. Để riêng để một lần upstream sập mạng không kéo đỏ cả ma trận hai OS.
    name: hash skill khớp upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: So hash với manifest upstream
        env:
          VIDEO_STUDIO_CHECK_UPSTREAM: '1'
        run: python -m pytest -q tests/test_upstream_skills.py

  ffmpeg:
    # Job RIÊNG, và là ngoại lệ có ý thức của câu đầu file: nó cài ffmpeg THẬT theo đúng INSTALL
    # (macOS `brew install ffmpeg-full`, Windows Gyan full) rồi đốt phụ đề thật. Lý do: Mac mini
    # 01/10/2026 cài `brew install ffmpeg` theo INSTALL cũ ⇒ không có drawtext/subtitles/ass, và
    # không test giả nào thấy được điều đó. Keg `ffmpeg-full` CỐ Ý không thêm vào PATH — mã phải
    # tự dò. `VIDEO_STUDIO_REQUIRE_FFMPEG=1` biến skip thành đỏ.
    name: ffmpeg thật — bộ lọc chữ + đốt phụ đề (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: ffmpeg-full (macOS — đúng lệnh INSTALL)
        if: runner.os == 'macOS'
        run: brew install ffmpeg-full
      - name: ffmpeg Gyan full (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg-full -y --no-progress
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: doctor thấy bộ lọc + smoke đốt phụ đề
        env:
          VIDEO_STUDIO_REQUIRE_FFMPEG: '1'
        run: python -m pytest -q -rs tests/test_ffmpeg_filters.py
